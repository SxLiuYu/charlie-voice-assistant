<title>魔幻手机 · 语音助理</title><style>

color:#4e9;font-size:13px;cursor:pointer;user-select:none}

border-radius:12px;padding:10px}

@keyframes flash{0%{background:rgba(100,200,255,.25)}100%{background:rgba(100,200,255,.12)}}
.msg.sys{color:#666;font-style:italic;font-size:12px}
#textinput{display:flex;gap:8px;width:90%;max-width:520px;margin-top:8px;margin-bottom:12px}

#remadd button{padding:8px 14px;border:none;border-radius:16px;background:#f5a623;color:#222;font-size:13px;cursor:pointer}
</style></head><body>
<h1>魔幻手机</h1><div class="sub">流式对话 · 自动监听 · 逐句播报</div>
<div id="tunnelurl" style="display:none;font-size:11px;color:#4e9;margin-bottom:4px;text-align:center;cursor:pointer" onclick="copyTunnelURL()"></div>
<div id="diag">📡 点击球授权麦克风，开启自动监听…</div>
<div id="orb" onclick="init()">🎙️</div>
<div id="status">点击球授权麦克风</div>
<div id="volwrap"><div id="volbarbg"><div id="volbar"></div></div></div>
<div id="volnum">音量 0.0</div>
<div id="controls">
<button id="stopbtn" onclick="interruptTTS()" style="padding:10px 18px;border:2px solid #f5a623;border-radius:28px;background:rgba(245,166,35,.1);color:#f5a623;font-size:13px;cursor:pointer;display:none">⏹️打断</button><button id="wakebtn" class="off" onclick="toggleWake()">唤醒词 OFF</button><button id="autobtn" onclick="toggleAuto()">自动监听 ON</button>
<button id="holdbtn" onmousedown="holdStart()" onmouseup="holdEnd()" onmouseleave="holdEnd()" ontouchstart="holdStart()" ontouchend="holdEnd()">按住说话</button>
</div>
<div id="conv"></div>
<div id="textinput">
<input id="msginput" placeholder="打字也行… 6个MCP流式回复">
<button onclick="sendText()">发送</button>
<button onclick="resetChat()" style="background:#4CAF50;color:#fff;padding:10px 14px;border:none;border-radius:20px;font-size:14px;cursor:pointer">重置</button>
</div>
<div id="rempanel"><h3>⏰ 提醒 <span onclick="loadRems()">刷新</span></h3><div id="remlist"></div>
<div id="remadd"><input id="remtext" placeholder="提醒内容…"><input id="remtime" placeholder="时间(如明天9点)" style="max-width:120px"><button onclick="addRem()">+</button></div></div>
<script>
// ===== 会话ID(多用户隔离, localStorage持久化) =====
function genSessionId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
let SESSION_ID=localStorage.getItem('magic_session_id')||genSessionId();
localStorage.setItem('magic_session_id',SESSION_ID);

const st=document.getElementById('status'),diag=document.getElementById('diag'),conv=document.getElementById('conv');
const orb=document.getElementById('orb'),volbar=document.getElementById('volbar'),volnum=document.getElementById('volnum');
let micStream=null,audioCtx=null,analyser=null,mediaRecorder=null;
let state='idle',mic=false,autoListen=true,recChunks=[],recStart=0;
let soundTimer=null,silenceTimer=null,cooldownTimer=null,streamingMsg=null;
let curVolume=0;
const SOUND_THRESHOLD=0.8,SILENCE_THRESHOLD=0.3,SOUND_DELAY=300,SILENCE_DELAY=1200,COOLDOWN=800;

function setState(s,icon,txt){state=s;orb.textContent=icon;orb.className=s;st.textContent=txt;}
function addMsg(cls,txt){const d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;conv.appendChild(d);conv.scrollTop=conv.scrollHeight;return d;}
function addReplyChunk(txt){if(!streamingMsg)streamingMsg=addMsg('b streaming','');streamingMsg.textContent+=txt;conv.scrollTop=conv.scrollHeight;}
function finishReply(){if(streamingMsg){streamingMsg.classList.remove('streaming');streamingMsg=null;}}

// ===== 音频队列(顺序播放) =====
let audioQueue=[],isPlaying=false;
function enqueueAudio(b64mp3){audioQueue.push(base64ToBlob(b64mp3,'audio/mpeg'));if(!isPlaying)playNextAudio();}
function playNextAudio(){
  if(audioQueue.length===0){isPlaying=false;setState('idle','🎙️','在听…');const sb=document.getElementById('stopbtn');if(sb)sb.style.display='none';startCooldown();return;}
  isPlaying=true;setState('speaking','🔊','朗读中…');const sb=document.getElementById('stopbtn');if(sb)sb.style.display='inline-block';
  const blob=audioQueue.shift();const audio=new Audio(URL.createObjectURL(blob));
  audio.onended=playNextAudio;audio.onerror=playNextAudio;
  audio.play().catch(()=>{setState('idle','🎙️','在听…');isPlaying=false;startCooldown();});
}
function base64ToBlob(b64,mime){const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}

// ===== SSE流解析 =====
async function streamSSE(response,onEvent){
  const reader=response.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines)if(ln.startsWith('data: '))try{onEvent(JSON.parse(ln.slice(6)));}catch(e){}}
}
function handleStreamEvent(data){
  switch(data.type){
    case'text':addReplyChunk(data.text);break;
    case'audio':enqueueAudio(data.audio);break;
    case'asr':addMsg('u',data.text);streamingMsg=null;setState('thinking','🧠','思考中(流式)…');break;
    case'done':finishReply();if(!isPlaying&&audioQueue.length===0){setState('idle','🎙️','在听…');startCooldown();}break;
    case'error':addMsg('sys','⚠️ '+(data.message||'错误'));setState('idle','🎙️','在听…');startCooldown();break;
  }
}
function startCooldown(){if(cooldownTimer)clearTimeout(cooldownTimer);cooldownTimer=setTimeout(()=>{cooldownTimer=null;},COOLDOWN);}

// ===== 流式文字对话(WebSocket优先, SSE降级) =====
async function sendText(){
  const m=document.getElementById('msginput').value.trim();if(!m)return;
  document.getElementById('msginput').value='';
  // 优先使用WebSocket
  if(await sendTextWS(m))return;
  // 降级到SSE
  addMsg('u',m);setState('thinking','🧠','思考中(流式)…');streamingMsg=null;
  try{const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,session_id:SESSION_ID})});
    if(!r.ok){st.textContent='错误:'+r.status;setState('idle','🎙️','在听…');return;}
    await streamSSE(r,handleStreamEvent);
  }catch(e){st.textContent='网络错误';setState('idle','🎙️','在听…');}
}
document.getElementById('msginput').addEventListener('keydown',e=>{if(e.key==='Enter')sendText();});

// ===== 麦克风初始化 + 自动监听 =====
async function init(){
  if(mic)return;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});
    mic=true;diag.textContent='✅ 麦克风就绪 · 自动监听已'+(autoListen?'开启':'关闭');
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=0.6;
    src.connect(analyser);updateVolume();setState('idle','🎙️','在听…');
  }catch(e){diag.textContent='❌ 麦克风错误:'+e.message+' — 可用打字';}
}
function updateVolume(){
  if(!analyser){return;}
  const d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);
  let v=0;for(let i=0;i<d.length;i++)v+=d[i];v=v/d.length/255*3;curVolume=v;
  volbar.style.width=Math.min(100,v*40)+'%';volnum.textContent='音量 '+v.toFixed(1);
  // 自动监听逻辑: 仅在idle+自动开启+无cooldown时触发
  if(autoListen&&state==='idle'&&!cooldownTimer){
    if(v>SOUND_THRESHOLD){
      if(!soundTimer)soundTimer=setTimeout(()=>{if(state==='idle'&&autoListen&&!cooldownTimer)startAutoRecord();},SOUND_DELAY);
    }else{clearTimeout(soundTimer);soundTimer=null;}
  }
  // 静默停止: 录音中检测到静默
  if(state==='listening'&&v<SILENCE_THRESHOLD){
    if(!silenceTimer)silenceTimer=setTimeout(()=>{if(state==='listening')stopAutoRecord();},SILENCE_DELAY);
  }else if(state==='listening'){clearTimeout(silenceTimer);silenceTimer=null;}
  requestAnimationFrame(updateVolume);
}
function toggleAuto(){
  autoListen=!autoListen;
  const btn=document.getElementById('autobtn');
  btn.textContent='自动监听 '+(autoListen?'ON':'OFF');
  btn.className=autoListen?'':'off';
  diag.textContent='自动监听已'+(autoListen?'开启':'关闭');
  if(!autoListen){clearTimeout(soundTimer);clearTimeout(silenceTimer);}
}
// ===== 自动录音 =====
function startAutoRecord(){
  if(!micStream||state!=='idle')return;
  recChunks=[];mediaRecorder=new MediaRecorder(micStream,{mimeType:'audio/webm'});
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=onAutoRecordStop;
  mediaRecorder.start();recStart=Date.now();
  setState('listening','👂','聆听中…(自动)');
}
function stopAutoRecord(){
  if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
}
async function onAutoRecordStop(){
  const dur=Date.now()-recStart;
  if(dur<500){setState('idle','🎙️','在听…');return;}
  const blob=new Blob(recChunks,{type:'audio/webm'});
  diag.textContent='📤 发送语音('+blob.size+'B,'+(dur/1000).toFixed(1)+'s)…';
  setState('thinking','🧠','识别+思考(流式)…');streamingMsg=null;
  try{const fd=new FormData();fd.append('file',blob,'audio.webm');
    const r=await fetch('/api/voice/stream?session_id='+SESSION_ID,{method:'POST',body:fd});
    if(!r.ok){st.textContent='错误:'+r.status;setState('idle','🎙️','在听…');startCooldown();return;}
    await streamSSE(r,handleStreamEvent);
  }catch(e){st.textContent='发送失败:'+e.message;setState('idle','🎙️','在听…');startCooldown();}
}
// ===== 按住说话(手动模式) =====
function holdStart(){
  if(state!=='idle'||!micStream)return;
  clearTimeout(soundTimer);clearTimeout(silenceTimer);
  recChunks=[];mediaRecorder=new MediaRecorder(micStream,{mimeType:'audio/webm'});
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=onAutoRecordStop;
  mediaRecorder.start();recStart=Date.now();
  setState('listening','👂','聆听中…');
}
function holdEnd(){if(state==='listening'&&mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();}

// ===== 提醒管理 =====
async function loadRems(){
  try{const r=await fetch('/api/reminders');const d=await r.json();const el=document.getElementById('remlist');
    if(!d.reminders||!d.reminders.length){el.innerHTML='<div style="color:#666;font-size:13px;padding:8px">暂无提醒</div>';return;}
    el.innerHTML=d.reminders.map(r=>{const c=r.done?'remitem done':'remitem';
      const t=r.due?'<span class="rtime">'+r.due.replace('T',' ').slice(0,16)+'</span>':'';
      return '<div class="'+c+'"><span class="rtxt">'+r.text+'</span>'+t+'<span class="rdel" onclick="delRem('+r.id+')">✓</span></div>';
    }).join('');
  }catch(e){document.getElementById('remlist').innerHTML='<div style="color:#e94560">加载失败</div>';}
}
async function addRem(){
  const t=document.getElementById('remtext').value.trim();const tm=document.getElementById('remtime').value.trim();
  if(!t)return;document.getElementById('remtext').value='';document.getElementById('remtime').value='';
  try{const r=await fetch('/api/reminders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,time:tm})});
    const d=await r.json();addMsg('sys',d.message||'已添加');loadRems();
  }catch(e){addMsg('sys','添加失败');}
}
async function delRem(id){try{await fetch('/api/reminders/'+id,{method:'DELETE'});loadRems();}catch(e){}}
async function resetChat(){
  try{const r=await fetch('/api/reset?session_id='+SESSION_ID,{method:'POST'});const d=await r.json();
    conv.innerHTML='';addMsg('sys','🔄 '+d.message);setState('idle','🎙️','新对话，在听…');
  }catch(e){addMsg('sys','重置失败');}
}
async function loadConv(){
  try{const r=await fetch('/api/conversation?session_id='+SESSION_ID);const d=await r.json();
    if(d.history&&d.history.length){d.history.forEach(m=>{if(m.role==='user'||m.role==='assistant')addMsg(m.role==='user'?'u':'b',m.content);});
      addMsg('sys','📂 已加载'+d.count+'条历史');}}catch(e){}
}
// ===== SSE通知 =====
let evtSource=null;
function initSSE(){
  if(evtSource)evtSource.close();
  try{evtSource=new EventSource('/api/events');
    evtSource.onmessage=function(e){try{const n=JSON.parse(e.data);
      if(n.type==='heartbeat'||n.type==='connect')return;
      const icon=n.type==='weather'?'🌦️':n.type==='morning'?'☀️':n.type==='bedtime'?'🌙':n.type==='health'?'⚠️':'⏰';
      addMsg('b',icon+' '+n.text);
      if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(n.text.replace(/[\n#*]/g,' '));u.lang='zh-CN';u.rate=1.05;speechSynthesis.speak(u);}
    }catch(err){}};
    evtSource.onerror=function(){evtSource.close();setTimeout(initSSE,5000);};
  }catch(e){}
}
// ===== WebSocket双向通信 =====
let wsConn=null,wsReady=false;
function wsConnect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  try{
    wsConn=new WebSocket(proto+'//'+location.host+'/ws');
    wsConn.onopen=()=>{wsReady=true;
      const oldDiag=diag.textContent;
      diag.textContent='✅ 实时连接已建立 · '+(oldDiag.replace(/^[✅📡❌].*?· /,''));
      // 重连后恢复SSE通知
      if(evtSource&&!evtSource.readyState||!evtSource)initSSE();
    };
    wsConn.onclose=()=>{wsReady=false;diag.textContent='📡 实时连接断开,5秒后重连…';setTimeout(wsConnect,5000);};
    wsConn.onerror=()=>{wsReady=false;};
    wsConn.onmessage=(e)=>{
      try{const data=JSON.parse(e.data);
        switch(data.type){
          case'connect':diag.textContent='✅ '+data.text+' · 自动监听已'+(autoListen?'开启':'关闭');break;
          case'pong':break; // 心跳回复
          case'asr':addMsg('u',data.text);streamingMsg=null;setState('thinking','🧠','思考中(流式)…');break;
          case'text':addReplyChunk(data.text);break;
          case'audio':if(data.data)enqueueAudio(data.data);break;
          case'done':finishReply();if(!isPlaying&&audioQueue.length===0){setState('idle','🎙️','在听…');startCooldown();}break;
          case'error':addMsg('sys','⚠️ '+(data.message||'错误'));setState('idle','🎙️','在听…');startCooldown();break;
          case'interrupted':audioQueue=[];if(isPlaying){isPlaying=false;}finishReply();
            setState('idle','🎙️','已打断,在听…');startCooldown();break;
        }
      }catch(err){}
    };
  }catch(e){setTimeout(wsConnect,5000);}
}
// WebSocket发送文字对话(优先WebSocket, 降级SSE)
async function sendTextWS(msg){
  if(wsReady&&wsConn&&wsConn.readyState===1){
    addMsg('u',msg);setState('thinking','🧠','思考中(流式)…');streamingMsg=null;
    wsConn.send(JSON.stringify({type:'text',message:msg,session_id:SESSION_ID}));
    return true;
  }
  return false; // 降级到SSE
}
// 打断TTS播放
function interruptTTS(){
  if(wsReady&&wsConn&&wsConn.readyState===1){
    wsConn.send(JSON.stringify({type:'interrupt'}));
  }
  audioQueue=[];if(isPlaying){isPlaying=false;}
  finishReply();
}
// ===== Tunnel URL (public access) =====
async function loadTunnelURL(){
  try{
    const r=await fetch('/api/tunnel');const d=await r.json();
    if(d.active&&d.url){
      const el=document.getElementById('tunnelurl');
      if(el){el.innerHTML='\u{1F310} \u516C\u7F51: '+d.url.replace('https://','');el.style.display='block';}
    }
  }catch(e){}
}
function copyTunnelURL(){
  const el=document.getElementById('tunnelurl');
  if(!el)return;const t=el.textContent;const url=t.replace(/^[^:]+: /,'');
  navigator.clipboard.writeText('https://'+url).then(()=>{
    el.innerHTML+=' \u2705\u5DF2\u590D\u5236';setTimeout(loadTunnelURL,2000);
  });
}
// ===== 唤醒词检测(魔幻手机) =====
let wakeMode=false,wakeRec=null;
const WAKE_WORDS=["魔幻手机","magic phone","magicphone","魔法手机"];
function toggleWake(){
  wakeMode=!wakeMode;
  const btn=document.getElementById('wakebtn');
  if(wakeMode){
    btn.textContent='唤醒词 ON';btn.className='active';
    if(!mic){diag.textContent='⚠️ 请先点击球授权麦克风';wakeMode=false;btn.textContent='唤醒词 OFF';btn.className='off';return;}
    startWakeListener();
    diag.textContent='🎤 唤醒词已开启,说"魔幻手机"激活对话';
  }else{
    btn.textContent='唤醒词 OFF';btn.className='off';
    stopWakeListener();
    diag.textContent='🎤 唤醒词已关闭';
  }
}
function startWakeListener(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){diag.textContent='⚠️ 浏览器不支持语音识别,请用Chrome';wakeMode=false;return;}
  wakeRec=new SR();
  wakeRec.lang='zh-CN';wakeRec.continuous=true;wakeRec.interimResults=true;
  wakeRec.onresult=function(e){
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript.toLowerCase().trim();
      // 检测唤醒词
      for(const w of WAKE_WORDS){
        if(t.includes(w.toLowerCase())){
          // 唤醒成功!
          stopWakeListener();
          diag.textContent='✅ 唤醒成功! 正在聆听...';
          setState('listening','👂','唤醒中...');
          // 如果自动监听关闭,临时启动一次录音
          if(!autoListen){startAutoRecord();}
          // 唤醒后3秒自动恢复监听
          setTimeout(()=>{if(wakeMode)startWakeListener();},3000);
          return;
        }
      }
    }
  };
  wakeRec.onerror=function(e){
    if(e.error==='no-speech')return; // 无语音,继续
    if(e.error==='aborted')return;   // 手动停止
    log_err('wake error:'+e.error);
    setTimeout(()=>{if(wakeMode)startWakeListener();},1000);
  };
  wakeRec.onend=function(){
    // 自动重启(浏览器会因静默停止)
    if(wakeMode)setTimeout(()=>{try{wakeRec.start();}catch(e){}},200);
  };
  try{wakeRec.start();}catch(e){}
}
function stopWakeListener(){
  if(wakeRec){try{wakeRec.onend=null;wakeRec.stop();wakeRec=null;}catch(e){}}
}
